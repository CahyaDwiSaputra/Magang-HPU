<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMSV6 Dashcam Player</title>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #0b1120; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
        
        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(11, 17, 32, 0.95); color: #94a3b8;
            font-size: 13px; gap: 10px; padding: 20px; text-align: center;
            z-index: 20; transition: opacity 0.3s;
        }
        #overlay.hidden { display: none; }
        
        .spinner {
            width: 28px; height: 28px;
            border: 2.5px solid #1e293b;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 9999px;
            font-size: 11px; font-weight: 600;
        }
        .badge-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-rose  { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
        .badge-blue  { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }

        .btn-action {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
            cursor: pointer; border: none; transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
        .btn-secondary:hover { background: #334155; }
        
        #status-bar {
            position: absolute; bottom: 8px; left: 8px;
            color: #cbd5e1; font-size: 11px; font-family: monospace;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);
            padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
            z-index: 10; display: flex; align-items: center; gap: 6px;
        }
        .dot { width: 7px; height: 7px; border-radius: 50%; }
        .dot-green { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot-amber { background: #f59e0b; }
        .dot-red   { background: #ef4444; }
    </style>
</head>
<body>
    <video id="video" muted autoplay playsinline crossorigin="anonymous"></video>

    <div id="overlay">
        <div class="spinner" id="spinner-el"></div>
        <div id="badge-container"></div>
        <div id="title-msg" style="font-size:14px;font-weight:600;color:#f8fafc;max-width:380px;">Menghubungkan ke kamera...</div>
        <div id="desc-msg" style="font-size:12px;color:#94a3b8;max-width:360px;line-height:1.4;">Mengakses gateway stream CMSV6...</div>
        <div id="actions-container" style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center;"></div>
    </div>

    <div id="status-bar">
        <span class="dot dot-amber" id="status-dot"></span>
        <span id="status-text">Inisialisasi...</span>
    </div>

    <script>
        const REGISTERED_CMSV6_DEVS = [
            '240078740672', '240078916025', '240078735201', '240079658477', 
            '240079676909', '240079636952', '240078740557', '240078734998', 
            '240078921470', '240078921678', '240078735110', '240078734980',
            '240078916116', '240078915951'
        ];
        
        const params   = new URLSearchParams(window.location.search);
        const devIdno  = params.get('dev') || '240078916116';
        const channel  = parseInt(params.get('ch') || '0', 10);
        const jsession = params.get('jsession');

        const videoEl     = document.getElementById('video');
        const overlay     = document.getElementById('overlay');
        const spinnerEl   = document.getElementById('spinner-el');
        const badgeCont   = document.getElementById('badge-container');
        const titleMsg    = document.getElementById('title-msg');
        const descMsg     = document.getElementById('desc-msg');
        const actionsCont = document.getElementById('actions-container');
        const statusText  = document.getElementById('status-text');
        const statusDot   = document.getElementById('status-dot');

        const displayChannel = channel + 1;
        const channelName = channel === 0 ? 'CAM 1 — Depan (Jalan)' : 'CAM 2 — Kabin Pengemudi';

        videoEl.muted = true;
        videoEl.defaultMuted = true;

        function setStatus(text, type = 'amber') {
            if (statusText) statusText.textContent = text;
            if (statusDot) {
                statusDot.className = 'dot ' + (type === 'green' ? 'dot-green' : type === 'red' ? 'dot-red' : 'dot-amber');
            }
        }

        function showOverlay(title, desc, badgeHtml = '', actions = [], showSpinner = false) {
            overlay.classList.remove('hidden');
            if (spinnerEl) spinnerEl.style.display = showSpinner ? 'block' : 'none';
            if (titleMsg) titleMsg.textContent = title;
            if (descMsg) descMsg.textContent = desc;
            if (badgeCont) badgeCont.innerHTML = badgeHtml;
            if (actionsCont) {
                actionsCont.innerHTML = '';
                actions.forEach(a => {
                    const btn = document.createElement('button');
                    btn.className = `btn-action ${a.primary ? 'btn-primary' : 'btn-secondary'}`;
                    btn.textContent = a.label;
                    btn.onclick = a.onClick;
                    actionsCont.appendChild(btn);
                });
            }
        }

        function hideOverlay() {
            overlay.classList.add('hidden');
        }

        // ── INIT STREAMING REALTIME LOGIC ──
        const isRegistered = REGISTERED_CMSV6_DEVS.includes(devIdno);

        if (!isRegistered) {
            // Perangkat belum didaftarkan di CMSV6 server
            setStatus('Perangkat Tidak Terdaftar di Server', 'amber');
            showOverlay(
                `Perangkat ${devIdno} Belum Terdaftar di CMSV6`,
                `Nomor seri MDVR/Dashcam ini belum didaftarkan di gateway server CMSV6 (10.10.0.33).`,
                `<span class="badge badge-amber">⚠️ ID Belum Terdaftar</span>`,
                [
                    {
                        label: 'Alihkan ke Unit Terdaftar (HD-78501)',
                        primary: true,
                        onClick: () => {
                            window.parent.postMessage({ type: 'SELECT_VEHICLE', deviceId: '240078916116' }, '*');
                        }
                    },
                    {
                        label: 'Coba Hubungkan Ulang',
                        primary: false,
                        onClick: () => window.location.reload()
                    }
                ]
            );
        } else {
            // Perangkat terdaftar — Sambungkan ke FLV Stream Realtime
            setStatus(`Menghubungkan CAM ${displayChannel}...`, 'amber');
            showOverlay(
                `Menghubungkan ke ${channelName}...`,
                `Meminta feed video live dari CMSV6 Gateway (10.10.0.33:6604)...`,
                `<span class="badge badge-blue">Unit Terdaftar di CMSV6</span>`,
                [],
                true
            );

            if (typeof flvjs === 'undefined' || !flvjs.isSupported()) {
                setStatus('Browser tidak support FLV MSE', 'red');
                showOverlay('Format FLV Tidak Didukung', 'Browser Anda tidak mendukung Media Source Extension (MSE). Silakan gunakan Google Chrome / Microsoft Edge terbaru.', '', [
                    { label: 'Coba Muat Ulang', primary: true, onClick: () => window.location.reload() }
                ]);
            } else {
                const host     = params.get('host') || '10.10.0.33:6604';
                const useProxy = params.get('proxy') === '1' || window.location.protocol === 'https:';
                const streamUrl = useProxy
                    ? `/api/cmsv6/stream?dev=${devIdno}&ch=${channel}&jsession=${jsession || ''}&stream=1`
                    : `http://${host}/3/3?AVType=1&jsession=${jsession || ''}&DevIDNO=${devIdno}&Channel=${channel}&Stream=1`;
                let started = false;

                const standbyTimeout = setTimeout(() => {
                    if (!started) {
                        setStatus('Unit Standby / Engine OFF di Pit', 'amber');
                        showOverlay(
                            `Unit ${devIdno} dalam Status Standby / Engine OFF`,
                            `Perangkat terdaftar di CMSV6, namun mesin unit saat ini mati atau sinyal 4G di area pit sedang offline. Menunggu siaran langsung dimulai.`,
                            `<span class="badge badge-amber">⏳ Engine Standby di Pit</span>`,
                            [
                                {
                                    label: 'Coba Hubungkan Ulang',
                                    primary: true,
                                    onClick: () => window.location.reload()
                                }
                            ]
                        );
                    }
                }, 5000);

                const player = flvjs.createPlayer({
                    type: 'flv',
                    url: streamUrl,
                    isLive: true,
                    hasAudio: false,
                    hasVideo: true,
                    cors: true,
                }, {
                    enableWorker: false,
                    lazyLoad: false,
                    enableStashBuffer: false,
                    stashInitialSize: 128,
                });

                player.attachMediaElement(videoEl);
                player.load();

                function onStreamReady() {
                    if (!started) {
                        started = true;
                        clearTimeout(standbyTimeout);
                        hideOverlay();
                        videoEl.style.display = 'block';
                        setStatus(`✓ Live CAM ${displayChannel} (Realtime)`, 'green');
                    }
                }

                videoEl.addEventListener('loadeddata', onStreamReady);
                videoEl.addEventListener('playing', onStreamReady);
                videoEl.addEventListener('timeupdate', () => {
                    if (videoEl.currentTime > 0) onStreamReady();
                });

                player.play().then(onStreamReady).catch(err => {
                    console.warn('[FLV] Autoplay:', err);
                });

                player.on(flvjs.Events.ERROR, () => {
                    // Handled by timeout prompt
                });
            }
        }
    </script>
</body>
</html>
